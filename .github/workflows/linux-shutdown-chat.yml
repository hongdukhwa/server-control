name: Linux Server Shutdown (Direct API)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  shutdown-linux:
    if: >-
      github.event.issue.user.id == 116593291 &&
      github.event.issue.title == '[POWER OFF] Linux-Server'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request shutdown by verified HTTPS
        env:
          CONTROL_API_TOKEN: ${{ secrets.CONTROL_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, socket, subprocess
          tok=os.environ.get("CONTROL_API_TOKEN", "")
          if not tok: raise SystemExit("CONTROL_API_TOKEN GitHub Secret is not configured")
          if not (4<=len(tok)<=160): raise SystemExit("invalid_token")
          base=["curl","-sS","--connect-timeout","6","--max-time","14","--compressed",
                "-H","User-Agent: Mozilla/5.0","-H","Accept: application/json"]
          targets=[("public",[],"https://honglab.store/api")]
          try:
              ips={x[4][0] for x in socket.getaddrinfo("daniel-server.iptime.org",443,type=socket.SOCK_STREAM)}
              for ip in sorted(ips):
                  if ":" not in ip:
                      targets.append(("origin",["--resolve","honglab.store:443:"+ip],"https://honglab.store/api"))
          except OSError:
              print("origin_dns_unavailable")
          targets.append(("legacy",[],"https://daniel-server.iptime.org/api"))
          selected=None
          for name,extra,api in targets:
              p=subprocess.run(base+extra+["-w","\n%{http_code}",api+"/status"],capture_output=True,timeout=18)
              if p.returncode:
                  print("probe",name,"TLS_or_network_unavailable")
                  continue
              payload,_,status=p.stdout.rpartition(b"\n")
              try: data=json.loads(payload)
              except (ValueError,UnicodeError): data={}
              if status.strip()==b"200" and data.get("status")=="online":
                  selected=(name,extra,api)
                  print("probe",name,"online")
                  break
              print("probe",name,"http",status.decode(errors="replace")[:3],"not_verified")
          if selected is None: raise SystemExit("no_verified_secure_API_route")
          name,extra,api=selected
          p=subprocess.run(base+extra+["-G","--data-urlencode","token="+tok,
              "-o","/dev/null","-w","%{http_code}",api+"/shutdown"],
              capture_output=True,timeout=20)
          if p.returncode:
              print("shutdown",name,"request_failed_or_connection_closed")
              raise SystemExit(1)
          code=p.stdout.decode(errors="replace").strip()
          print("shutdown",name,"HTTP",code)
          if code!="200": raise SystemExit("shutdown_API_rejected")
          print("SHUTDOWN_REQUEST_ACCEPTED; physical power-off still needs confirmation")
          PY
